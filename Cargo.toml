[workspace]
resolver = "2"
members = [
  "crates/nedo-core",
  "crates/nedo-format",
  "crates/nedo-morph-bundle",
  "crates/nedo-tokenizer",
  "crates/nedo-python",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.96"
description = "NedoTokenizer byte-exact Turkish morphological tokenizer components"
homepage = "https://github.com/ethosoftai/NedoTokenizer"
repository = "https://github.com/ethosoftai/NedoTokenizer"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
